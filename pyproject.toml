[project]
name = "sbsllm"
version = "0.1.0"
description = "Side-by-side LLM testing app — test prompts against multiple AI chats simultaneously"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.6.0",
]

[project.scripts]
sbsllm = "sbsllm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sbsllm"]
